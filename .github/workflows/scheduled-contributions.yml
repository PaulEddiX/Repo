name: Scheduled contributions

on:
  schedule:
    # Remaining July 2026 batch
    - cron: "59 15 30 7 *"  # Jul 30 +19h -> 3 commits (18:59 UTC+3)
    - cron: "59 23 30 7 *"  # Jul 31 +27h -> 1 commit
    - cron: "59 9 31 7 *"   # Jul 31 +37h -> 2 commits
    - cron: "59 20 31 7 *"  # Jul 31 +48h -> 5 commits
    # August 2026
    - cron: "44 9 1 8 *"    # Aug 1 Fri 12:44 PM UTC+3 -> 3 commits
    - cron: "12 20 2 8 *"   # Aug 2 11:12 PM UTC+3 -> 1 commit
    # Aug 3 — 5 commits spread 30min–2h apart (UTC+3)
    - cron: "17 5 3 8 *"    # 08:17 AM UTC+3
    - cron: "13 6 3 8 *"    # 09:13 AM UTC+3 (+56m)
    - cron: "35 7 3 8 *"    # 10:35 AM UTC+3 (+1h 22m)
    - cron: "23 8 3 8 *"    # 11:23 AM UTC+3 (+48m)
    - cron: "4 10 3 8 *"    # 01:04 PM UTC+3 (+1h 41m)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide commit count
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            "59 15 30 7 *") COUNT=3 ;;
            "59 23 30 7 *") COUNT=1 ;;
            "59 9 31 7 *") COUNT=2 ;;
            "59 20 31 7 *") COUNT=5 ;;
            "44 9 1 8 *") COUNT=3 ;;
            "12 20 2 8 *") COUNT=1 ;;
            "17 5 3 8 *"|"13 6 3 8 *"|"35 7 3 8 *"|"23 8 3 8 *"|"4 10 3 8 *") COUNT=1 ;;
            *) COUNT=1 ;;
          esac
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create scheduled commits
        env:
          COUNT: ${{ steps.plan.outputs.count }}
        run: |
          git config user.name "PaulEddiX"
          git config user.email "Paul.Edwardsxqwe@gmail.com"
          for i in $(seq 1 "$COUNT"); do
            TS="$(date -u +"%Y-%m-%d %H:%M UTC")"
            FILE="scheduled/log-${TS//[: ]/-}-$i.txt"
            mkdir -p scheduled
            {
              echo "Scheduled contribution batch"
              echo "Timestamp: $TS"
              echo "Batch item: $i of $COUNT"
              echo "Trigger: ${{ github.event.schedule }}"
            } > "$FILE"
            git add "$FILE"
            git commit -m "Scheduled update $i/$COUNT ($TS)"
          done
          git push
